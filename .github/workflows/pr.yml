name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install + gate
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          pip install -U pip setuptools wheel
          pip install -e ".[dev]"
          ruff check src tests
          pytest -q
          printf 'LGTM - no blocking issues found.\n' > /tmp/lgtm.md
          PYTHONPATH=src python scripts/check_review_gate.py /tmp/lgtm.md

  review:
    name: review (Themis)
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache Cursor CLI
        id: cache-cursor
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin
            ~/.local/share/cursor-agent
            ~/.cursor/bin
          key: cursor-cli-${{ runner.os }}-v4
      - name: Install Cursor CLI
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.cursor/bin:$PATH"
          if [[ "${{ steps.cache-cursor.outputs.cache-hit }}" == "true" ]] && command -v agent >/dev/null 2>&1; then
            echo "Cursor agent ready (cache): $(command -v agent)"
            exit 0
          fi
          echo "Installing Cursor CLI (cache miss or incomplete restore)…"
          curl -fsSL https://cursor.com/install | bash
      - name: Add Cursor CLI to PATH
        run: |
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Themis review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "CURSOR_API_KEY not set — cannot run blocking Themis review."
            exit 1
          fi
          export PATH="$HOME/.local/bin:$HOME/.cursor/bin:$PATH"
          if ! command -v agent >/dev/null 2>&1; then
            echo "Cursor agent binary missing after install step." >&2
            exit 127
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD 2>/dev/null \
            && ! git merge-base origin/main HEAD >/dev/null 2>&1; then
            echo "No merge-base with origin/main — rebase required before Themis can review." >&2
            exit 1
          fi
          : > themis.diff
          git --no-pager diff origin/main...HEAD -- . >> themis.diff
          if [ ! -s themis.diff ] || [ -z "$(tr -d '[:space:]' < themis.diff)" ]; then
            echo "LGTM - no blocking issues found." > review.md
          else
            printf '%s\n' \
              'You are Themis reviewing a Mahogany PR. Follow .cursor/rules/code-review.mdc exactly.' \
              'Review ONLY this branch'\''s changes vs origin/main.' \
              'The unified diff is in the workspace file themis.diff — read that file (do not invent files outside the diff).' \
              'Produce the required markdown sections (## Summary, ## Blocking issues, ## Risks, ## Nits)' \
              'or the single-line LGTM shortcut when clean.' \
              > themis-prompt.txt
            set +e
            agent -p --force --api-key "$CURSOR_API_KEY" --output-format text "$(cat themis-prompt.txt)" \
              > review.md 2> review.err
            AGENT_EC=$?
            set -e
            if [ -s review.err ]; then
              echo "----- Themis stderr -----"
              cat review.err
            fi
            if [ ! -s review.md ]; then
              echo "Cursor review produced no output (see build log above)." > review.md
            fi
            if [ "$AGENT_EC" -ne 0 ] && grep -q 'Cursor review produced no output' review.md; then
              echo "Themis agent exited $AGENT_EC with empty review." >&2
              exit 1
            fi
            if [ "$AGENT_EC" -ne 0 ] && grep -qiE 'Argument list too long|E2BIG' review.err; then
              echo "Themis agent failed with ARG_MAX — themis.diff must be file-based." >&2
              exit 1
            fi
          fi
          echo "----- Themis review -----"
          cat review.md
          BODY="$(printf '<!-- mahogany-themis-review -->\n## Themis review\n\n%s\n' "$(cat review.md)")"
          gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY"
          bash scripts/check_review_gate.sh review.md

  isolation:
    name: isolation (Themis)
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: mbugaiov/themis-agent
          ref: 3250607f3700d0c2cb73f226435e4b69afd2e118
          path: .themis-agent
      - name: Cache Cursor CLI
        id: cache-cursor
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin
            ~/.local/share/cursor-agent
            ~/.cursor/bin
          key: cursor-cli-${{ runner.os }}-v4
      - name: Install Cursor CLI
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.cursor/bin:$PATH"
          if [[ "${{ steps.cache-cursor.outputs.cache-hit }}" == "true" ]] && command -v agent >/dev/null 2>&1; then
            echo "Cursor agent ready (cache): $(command -v agent)"
            exit 0
          fi
          curl -fsSL https://cursor.com/install | bash
      - name: Add Cursor CLI to PATH
        run: |
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: isolation (Themis)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet || true
          bash .themis-agent/scripts/ci_isolation.sh --mode product --base origin/main
      - name: Upload isolation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolation-review-md
          path: isolation-review.md
          retention-days: 7
          if-no-files-found: ignore

  auto-merge:
    name: auto-merge
    runs-on: ubuntu-slim
    timeout-minutes: 15
    needs: [gate, review, isolation]
    if: github.event.pull_request.draft == false
    permissions:
      contents: write
      pull-requests: write
      issues: read
      checks: read
      actions: write
    steps:
      - name: Checkout default branch (trusted wrappers)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Checkout themis-agent (follow-up scripts, pinned)
        uses: actions/checkout@v4
        with:
          repository: mbugaiov/themis-agent
          ref: 3250607f3700d0c2cb73f226435e4b69afd2e118
          path: .themis-agent

      - name: Require Themis Risks/Nits disposed
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          THEMIS_REVIEW_MARKER: "<!-- mahogany-themis-review -->"
          THEMIS_FOLLOWUP_DISPOSE_MARKER: "<!-- mahogany-review-followups-disposed -->"
          THEMIS_FOLLOWUP_SECTIONS: "Risks,Nits"
        run: bash scripts/check_review_followups_disposed.sh "${{ github.event.pull_request.number }}"

      - name: Squash-merge and trigger Deploy STG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number }}"
          if gh pr merge "$PR" --squash; then
            echo "Merged #$PR"
          else
            STATE="$(gh pr view "$PR" --json state -q .state 2>/dev/null || true)"
            if [[ "$STATE" == "MERGED" ]]; then
              echo "PR #$PR already merged — continuing to Deploy STG dispatch"
            else
              echo "ERROR: could not squash-merge #$PR"
              exit 1
            fi
          fi
          echo "Dispatching Deploy STG on main"
          ok=0
          for attempt in 1 2 3; do
            if gh workflow run deploy-stg.yml --ref main; then
              ok=1
              break
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep 5
            fi
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "ERROR: Deploy STG dispatch failed after merge"
            exit 1
          fi
